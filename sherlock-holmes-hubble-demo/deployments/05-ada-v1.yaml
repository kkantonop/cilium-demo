---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ada
  namespace: baker-st
  labels:
    app.kubernetes.io/name: ada
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ada
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ada
    spec:
      containers:
      - name: ada
        image: python:3.14-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - |
          mkdir -p /tmp/www
          printf '%s\n' 'Miss Ada Moran - Nothing suspicious here' > /tmp/www/index.html
          exec python3 -u -m http.server 8080 --bind 0.0.0.0 --directory /tmp/www
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ada
  namespace: baker-st
  labels:
    app.kubernetes.io/name: ada
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ada
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
