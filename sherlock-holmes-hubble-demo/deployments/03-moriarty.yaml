---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moriarty
  namespace: baker-st
  labels:
    app.kubernetes.io/name: moriarty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moriarty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moriarty
        cluster-dns-network-policy: 'true'
    spec:
      containers:
      - name: moriarty
        image: python:3.14-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - |
          mkdir -p /tmp/www
          printf '%s\n' 'Professor Moriarty - Consulting criminal' > /tmp/www/index.html
          mkdir -p /tmp/www/intel
          printf '%s\n' 'Received Scotland Yard intelligence.' > /tmp/www/intel/scotland-yard
          printf '%s\n' 'Received intelligence about The Strand.' > /tmp/www/intel/strand-magazine
          exec python3 -u -m http.server 8080 --bind 0.0.0.0 --directory /tmp/www
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moriarty
  namespace: baker-st
  labels:
    app.kubernetes.io/name: moriarty
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moriarty
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
