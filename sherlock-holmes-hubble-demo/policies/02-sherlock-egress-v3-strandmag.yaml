---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sherlock-egress
  namespace: baker-st
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sherlock
  description: 'Act III: Sherlock can reach Watson, Lestrade and strandmag.com over
    HTTPS.'
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: watson
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: lestrade
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toFQDNs:
    - matchName: strandmag.com
    - matchName: www.strandmag.com
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
